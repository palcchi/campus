<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>HTML GWEH</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      display: flex;
      align-items: center;
    }

    .text {
      position: absolute;
      left: 0;
      white-space: nowrap;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(60px, 12vw, 180px);
      font-weight: 900;
      color: #000000;

      animation: move 5s linear infinite;
    }

    @keyframes move {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(100vw);
      }
    }
  </style>
</head>

<body>

  <div class="text">HTML GWEH</div>

</body>
</html>
