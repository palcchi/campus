services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klinik_app
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - vendor_data:/app/vendor
    depends_on:
      db:
        condition: service_healthy
    environment:
      CI_ENVIRONMENT: development

  db:
    image: mariadb:11.4
    container_name: klinik_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: klinik
      MARIADB_USER: klinik
      MARIADB_PASSWORD: klinik123
    ports:
      - "3306:3306"
    volumes:
      - klinik_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: klinik_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: klinik
      PMA_PASSWORD: klinik123
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

volumes:
  klinik_db_data:
  vendor_data:
